[project]
name = "emergency-911-analytics"
version = "2.0.0"
description = "911 call analytics: statistics, geospatial hotspots, forecasting and staffing decisions"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/dashboard.py" = ["E402", "E501"]
"tests/*" = ["E501"]
"notebooks/*" = ["E402"]
